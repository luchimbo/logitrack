[project]
name = "propiedades-monitor"
version = "0.1.0"
description = "Monitor local para Zonaprop y Argenprop con busquedas guardadas"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "playwright>=1.47.0",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.4.0",
    "python-slugify>=8.0.4",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
